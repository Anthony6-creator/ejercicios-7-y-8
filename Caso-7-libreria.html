<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caso 7 - Facturación Librería Académica</title>
<style>
  :root { --azul:#1d3349; --naranja:#f58a1f; --fondo:#f4f6f8; }
  * { box-sizing:border-box; }
  body { font-family:Arial, sans-serif; background:var(--fondo); margin:0; padding:24px; color:#222; }
  .contenedor { max-width:820px; margin:auto; background:#fff; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.1); overflow:hidden; }
  header { background:var(--azul); color:#fff; padding:18px 24px; border-bottom:5px solid var(--naranja); }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; font-size:14px; opacity:.85; }
  main { padding:24px; }
  .fila { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
  .campo { flex:1; min-width:180px; display:flex; flex-direction:column; }
  label { font-weight:bold; font-size:14px; margin-bottom:4px; }
  input { padding:9px; border:1px solid #bbb; border-radius:6px; font-size:15px; }
  button { padding:10px 18px; border:none; border-radius:6px; cursor:pointer; font-size:15px; color:#fff; background:var(--azul); }
  button.naranja { background:var(--naranja); }
  button.gris { background:#777; }
  button:hover { opacity:.88; }
  #mensaje { margin:14px 0; padding:10px 14px; border-radius:6px; display:none; font-size:14px; }
  #mensaje.error { display:block; background:#fdecea; color:#a12622; border:1px solid #f5b5b0; }
  #mensaje.advertencia { display:block; background:#fff6e0; color:#7a5200; border:1px solid #f1d28a; }
  #mensaje.ok { display:block; background:#e7f6ea; color:#1e6b34; border:1px solid #a9dbb5; }
  h2 { font-size:17px; color:var(--azul); border-bottom:2px solid var(--naranja); padding-bottom:4px; margin-top:26px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { background:var(--azul); color:#fff; text-align:left; padding:8px; }
  td { padding:8px; border-bottom:1px solid #e3e3e3; }
  td.der, th.der { text-align:right; }
  #factura { background:#fafafa; border:1px solid #ddd; border-radius:8px; padding:14px 18px; display:none; }
  #factura p { margin:6px 0; }
  #factura .total { font-size:20px; font-weight:bold; color:var(--azul); }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <h1>Librería Académica — Sistema de Facturación</h1>
    <p>Caso 7 · Técnica de programación · Vectores paralelos en JavaScript</p>
  </header>

  <main>
    <!-- Campos de entrada y botones -->
    <div class="fila">
      <div class="campo">
        <label for="nombre">Nombre del producto</label>
        <input type="text" id="nombre" placeholder="Ej. Libro de Matemáticas">
      </div>
      <div class="campo" style="max-width:180px">
        <label for="precio">Precio unitario ($)</label>
        <input type="number" id="precio" step="0.01" placeholder="Ej. 12.50">
      </div>
      <button id="btnAgregar" class="naranja">Agregar producto</button>
    </div>

    <!-- Zona de mensajes (errores, advertencias y confirmaciones) -->
    <div id="mensaje"></div>

    <h2>Productos registrados</h2>
    <table>
      <thead><tr><th>#</th><th>Producto</th><th class="der">Precio</th></tr></thead>
      <tbody id="listaProductos"></tbody>
    </table>

    <div class="fila" style="margin-top:16px">
      <button id="btnFactura">Generar factura</button>
      <button id="btnLimpiar" class="gris">Limpiar todo</button>
    </div>

    <!-- Sección de resultados -->
    <h2>Factura</h2>
    <div id="factura"></div>
    <p id="sinFactura" style="color:#777;font-size:14px">Aún no se ha generado ninguna factura.</p>
  </main>
</div>

<script>
/* ==========================================================
   CASO 7: SISTEMA DE FACTURACIÓN - LIBRERÍA ACADÉMICA
   Estructuras de datos: dos vectores unidimensionales paralelos.
   La posición i de productos[] corresponde a la posición i de precios[].
   ========================================================== */
const IVA = 0.15;          // IVA vigente en Ecuador (15%)
const productos = [];      // nombres de los productos
const precios = [];        // precio unitario de cada producto

// Referencias al DOM
const $nombre = document.getElementById("nombre");
const $precio = document.getElementById("precio");
const $mensaje = document.getElementById("mensaje");
const $lista = document.getElementById("listaProductos");
const $factura = document.getElementById("factura");
const $sinFactura = document.getElementById("sinFactura");

/* Muestra un mensaje al usuario. tipo: "error" | "advertencia" | "ok" */
function mostrarMensaje(texto, tipo) {
  $mensaje.textContent = texto;
  $mensaje.className = tipo;
}

/* Redondea a 2 decimales evitando errores de coma flotante (5.355 -> 5.36) */
function redondear(valor) {
  return Math.round((valor + Number.EPSILON) * 100) / 100;
}

/* Busca si un nombre ya existe en el vector (sin distinguir mayúsculas).
   Recorre el vector con un ciclo for; devuelve true si lo encuentra. */
function existeProducto(nombre) {
  for (let i = 0; i < productos.length; i++) {
    if (productos[i].toLowerCase() === nombre.toLowerCase()) {
      return true;
    }
  }
  return false;
}

/* ---------- AGREGAR PRODUCTO (con validaciones) ---------- */
function agregarProducto() {
  const nombre = $nombre.value.trim();
  const textoPrecio = $precio.value.trim();
  const precio = parseFloat(textoPrecio);

  // Validación 1: nombre vacío
  if (nombre === "") {
    mostrarMensaje("Error: el nombre del producto no puede estar vacío.", "error");
    return;
  }
  // Validación 2: precio vacío o no numérico
  if (textoPrecio === "" || isNaN(precio)) {
    mostrarMensaje("Error: debe ingresar un precio válido.", "error");
    return;
  }
  // Validación 3: precio negativo (o cero, que no tiene sentido en una venta)
  if (precio <= 0) {
    mostrarMensaje("Error: el precio debe ser mayor que cero (no se permiten negativos).", "error");
    return;
  }
  // Validación 4: producto duplicado
  if (existeProducto(nombre)) {
    mostrarMensaje('Advertencia: el producto "' + nombre + '" ya fue registrado. No se permiten duplicados.', "advertencia");
    return;
  }

  // Todo correcto: se guarda en ambos vectores paralelos
  productos.push(nombre);
  precios.push(precio);

  mostrarMensaje('Producto "' + nombre + '" agregado correctamente.', "ok");
  $nombre.value = "";
  $precio.value = "";
  $nombre.focus();
  mostrarLista();
}

/* ---------- MOSTRAR LISTA DE PRODUCTOS ---------- */
function mostrarLista() {
  $lista.innerHTML = "";
  // Ciclo for que recorre los vectores paralelos
  for (let i = 0; i < productos.length; i++) {
    const fila = document.createElement("tr");
    const c1 = document.createElement("td");
    const c2 = document.createElement("td");
    const c3 = document.createElement("td");
    c1.textContent = i + 1;
    c2.textContent = productos[i];          // textContent evita inyección de HTML
    c3.textContent = "$" + precios[i].toFixed(2);
    c3.className = "der";
    fila.append(c1, c2, c3);
    $lista.appendChild(fila);
  }
}

/* ---------- GENERAR FACTURA Y ESTADÍSTICAS ---------- */
function generarFactura() {
  if (productos.length === 0) {
    mostrarMensaje("Error: no hay productos registrados para facturar.", "error");
    return;
  }

  // Un solo recorrido con for: acumula el subtotal y busca el precio máximo
  let subtotal = 0;
  let indiceMax = 0;                       // posición del producto más caro
  for (let i = 0; i < precios.length; i++) {
    subtotal += precios[i];                // acumulador de la suma
    if (precios[i] > precios[indiceMax]) { // condicional para el máximo
      indiceMax = i;
    }
  }

  const subtotalR = redondear(subtotal);
  const iva = redondear(subtotalR * IVA);
  const total = redondear(subtotalR + iva);
  const promedio = redondear(subtotal / precios.length);

  // Se arma la factura en pantalla
  $factura.innerHTML = "";
  const lineas = [
    "Subtotal: $" + subtotalR.toFixed(2),
    "IVA (15%): $" + iva.toFixed(2),
    null, // marcador del total (con estilo propio)
    "Cantidad total de productos vendidos: " + productos.length,
    "Producto más caro: \"" + productos[indiceMax] + "\" ($" + precios[indiceMax].toFixed(2) + ")",
    "Promedio de precios: $" + promedio.toFixed(2)
  ];
  for (let i = 0; i < lineas.length; i++) {
    const p = document.createElement("p");
    if (lineas[i] === null) {
      p.className = "total";
      p.textContent = "Total a pagar: $" + total.toFixed(2);
    } else {
      p.textContent = lineas[i];
    }
    $factura.appendChild(p);
  }
  $factura.style.display = "block";
  $sinFactura.style.display = "none";
  mostrarMensaje("Factura generada correctamente.", "ok");
}

/* ---------- LIMPIAR (reinicia vectores y pantalla) ---------- */
function limpiarTodo() {
  productos.length = 0;   // vacía el vector sin crear uno nuevo
  precios.length = 0;
  mostrarLista();
  $factura.style.display = "none";
  $sinFactura.style.display = "block";
  $mensaje.className = "";
  $mensaje.textContent = "";
}

// Eventos de los botones (Enter en los campos también agrega)
document.getElementById("btnAgregar").addEventListener("click", agregarProducto);
document.getElementById("btnFactura").addEventListener("click", generarFactura);
document.getElementById("btnLimpiar").addEventListener("click", limpiarTodo);
[$nombre, $precio].forEach(function (c) {
  c.addEventListener("keydown", function (e) { if (e.key === "Enter") agregarProducto(); });
});
</script>
</body>
</html>
